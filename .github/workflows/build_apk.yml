name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Bootstrap Flutter Android Scaffolding
        run: |
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/
          cp -r lib /tmp/backup/
          cp android/app/src/main/AndroidManifest.xml /tmp/backup/
          rm -rf cashtrack_flutter_project
          flutter create --org com.cashtrack --project-name cash_track .
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          cp -r /tmp/backup/lib/* lib/
          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle
          sed -i 's/minSdk .*/minSdk 23/g' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashTrack-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
